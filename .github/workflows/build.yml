name: Pebble build and static checks

on:
  workflow_dispatch:
  push:
    branches: [main, improve-reliability-sdk-2026]
  pull_request:

permissions:
  contents: write
concurrency:
  group: kineticast-direct-pbw-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v6
      - name: Install Pebble build dependencies
        run: sudo apt-get update && sudo apt-get install -y libsdl2-2.0-0 libglib2.0-0 libpixman-1-0 zlib1g libsndio7.0
      - name: Check JavaScript syntax and manifest
        run: |
          node --check src/pkjs/index.js
          node --check src/pkjs/custom-clay.js
          node tests/weather-xhr.test.js
          node tests/weather-units.test.js
          node tests/weather-providers.test.js
          node tests/weather-release.test.js
          node tests/weather-plus.test.js
          node tests/shake-tts.test.js
          node tests/calendar-next-event.test.js
          node tests/calendar-persistent.test.js
          node tests/power-efficiency.test.js
          node --check src/pkjs/universal_tts.js
          node -e "const p=require('./package.json');if(p.pebble.sdkVersion!=='3'||!p.pebble.targetPlatforms.includes('emery'))process.exit(1)"
      # Keep the application SDK at or below firmware deployed to Pebble Time 2.
      # Installing 'latest' can produce a PBW that refuses to load on 4.44.x firmware.
      - name: Install Pebble CLI and firmware-compatible SDK
        run: |
          uv tool install pebble-tool
          pebble sdk install 4.44
          pebble sdk activate 4.44
          pebble sdk list
      - name: Build for Emery
        run: pebble build
      - uses: actions/upload-artifact@v4
        with:
          name: kineticast-emery
          path: build/*.pbw
          if-no-files-found: error

      - name: Prepare direct-download PBW
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          mkdir -p direct-download
          cp build/*.pbw direct-download/kineticast.pbw
      - name: Publish direct PBW from successful main build
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view dev-latest >/dev/null 2>&1; then
            gh release create dev-latest --target "$GITHUB_SHA" \
              --title "Latest development PBW" --prerelease \
              --notes "Automatically updated after successful main builds. Download the .pbw directly without extracting the Actions ZIP."
          fi
          gh release upload dev-latest direct-download/kineticast.pbw --clobber
          echo "### Direct PBW" >> "$GITHUB_STEP_SUMMARY"
          echo "[Download KinetiCast.pbw](https://github.com/$GITHUB_REPOSITORY/releases/download/dev-latest/kineticast.pbw)" >> "$GITHUB_STEP_SUMMARY"
